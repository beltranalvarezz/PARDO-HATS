<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PardoHT — Prueba 3D</title>
  <link rel="icon" href="img/logo-rosa.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;800&family=Dancing+Script:wght@600&family=Pacifico&family=Pinyon+Script&display=swap" rel="stylesheet">
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    } }
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; font-family: "Archivo", Arial, sans-serif; background: #efedea; color: #111; }
    body.oscuro { background: #2a1220; color: #fff; }
    #lienzo { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
    #lienzo:active { cursor: grabbing; }
    .panel { position: fixed; left: 0; right: 0; top: 0; padding: 22px 28px; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; }
    .panel > * { pointer-events: auto; }
    .titulo p { font-size: 10px; font-weight: 700; letter-spacing: .35em; color: #c97fa2; }
    .titulo h1 { font-family: "Pinyon Script", cursive; font-weight: 400; font-size: 46px; line-height: 1.1; }
    .volver { font-size: 11px; font-weight: 800; letter-spacing: .14em; color: inherit; text-decoration: none; border-bottom: 1px solid currentColor; }
    .controles { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .controles button {
      display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 40px;
      border: 1.5px solid rgba(128,128,128,.35); background: transparent; color: inherit; cursor: pointer;
      font: 800 11px "Archivo", Arial, sans-serif; letter-spacing: .12em; text-transform: uppercase;
    }
    .controles button.activo { background: currentColor; }
    .controles button.activo span { color: #efedea; }
    body.oscuro .controles button.activo span { color: #2a1220; }
    .controles i { width: 14px; height: 14px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.2); }
    .ayuda { position: fixed; right: 28px; bottom: 34px; font-size: 10px; letter-spacing: .2em; opacity: .5; }
    .cargando { position: fixed; inset: 0; display: grid; place-items: center; font-size: 11px; letter-spacing: .3em; opacity: .6; }
    @media (max-width: 700px) { .ayuda { display: none; } .panel { padding: 16px; } .titulo h1 { font-size: 36px; } }
  </style>
</head>
<body>
  <canvas id="lienzo"></canvas>
  <p class="cargando" id="cargando">CARGANDO GORRA…</p>

  <div class="panel">
    <div class="titulo">
      <p>PARDOHT · PRUEBA 3D</p>
      <h1>Faith in me</h1>
    </div>
    <a href="index.html" class="volver">← VOLVER A LA WEB</a>
  </div>

  <div class="controles">
    <button data-color="rosa" class="activo"><i style="background:#c38f86"></i><span>Rosa</span></button>
    <button data-color="negro"><i style="background:#1b1b1d"></i><span>Negro</span></button>
    <button id="btnFondo"><span>Fondo oscuro</span></button>
    <button id="btnGiro" class="activo"><span>Girar sola</span></button>
  </div>
  <p class="ayuda">ARRASTRA PARA GIRAR · RUEDA PARA ACERCAR</p>

  <script type="module" src="prueba3d.js?v=3"></script>
</body>
</html>
