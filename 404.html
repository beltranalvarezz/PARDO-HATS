<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- GitHub Pages sirve esta página para cualquier ruta que no existe: la base hace que logo y enlaces funcionen desde cualquier ruta -->
  <script>document.write('<base href="' + (location.pathname.startsWith("/PARDO-HATS/") ? "/PARDO-HATS/" : "/") + '">');</script>
  <title>Página no encontrada | PardoHT</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;800&family=Pinyon+Script&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px;
      font-family: "Archivo", Arial, sans-serif; color: #fff;
      background: radial-gradient(ellipse at 50% 45%, #3e1a2d 0%, #1a0b13 50%, #0c0609 100%);
    }
    img { width: 110px; margin: 0 auto 28px; display: block; }
    p.mini { font-size: 11px; font-weight: 800; letter-spacing: .4em; color: #e8a6c4; margin-bottom: 6px; }
    h1 { font-family: "Pinyon Script", cursive; font-weight: 400; font-size: clamp(56px, 12vw, 110px); line-height: 1.05; margin-bottom: 14px; }
    p.texto { max-width: 380px; margin: 0 auto 30px; font-size: 15px; line-height: 1.6; opacity: .8; }
    a.boton { display: inline-block; padding: 16px 34px; background: #fff; color: #111; text-decoration: none; font-size: 13px; font-weight: 800; letter-spacing: .12em; }
    a.boton:hover { background: #e8a6c4; }
  </style>
</head>
<body>
  <main>
    <img src="img/logo-rosa.png" alt="PardoHT">
    <p class="mini">ERROR 404</p>
    <h1>Esta página se ha perdido</h1>
    <p class="texto">Puede que el enlace esté mal escrito o que la página ya no exista. La gorra, en cambio, sigue aquí.</p>
    <a class="boton" href="./">VOLVER A LA TIENDA</a>
  </main>
</body>
</html>
